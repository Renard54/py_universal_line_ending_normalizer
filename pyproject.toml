[project]
name = "py-universal-line-ending-normalizer"
version = "0.1.1"
description = "Finds and replaces CR, LF, CRLF, and U+2028 line breaks in strings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
